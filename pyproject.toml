[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-solver"
version = "1.0.0"
description = "Desktop orbit fitting and visualization for asteroids and comets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Martin Mašek" }]
dependencies = [
    "PySide6>=6.6",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "astropy>=5.3",
    "jplephem>=2.22",
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[project.urls]
Homepage = "https://github.com/cassi-astronomy/Orbit-Solver"
Issues = "https://github.com/cassi-astronomy/Orbit-Solver/issues"

[tool.setuptools.packages.find]
include = ["orbit_app*"]

[tool.setuptools.package-data]
orbit_app = ["data/*.json", "data/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["orbit-data", "artifacts", "build", "dist"]

[tool.ruff.lint]
# Start with correctness checks that can be enforced on the existing codebase.
# Broader style rules can be enabled incrementally without obscuring science changes.
select = ["E9", "F63", "F7", "F82"]
